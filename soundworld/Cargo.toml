[package]
name = "soundworld"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
crossbeam-channel = "0.5"
eframe = { version = "0.27", default-features = false, features = ["glow", "x11"] }
egui = "0.27"
hound = "3.5"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
rand = "0.8"
rand_chacha = "0.3"
ringbuf = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
